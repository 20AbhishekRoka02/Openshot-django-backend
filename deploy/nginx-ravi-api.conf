server {
    listen 443 ssl;
    server_name ravi.example.com;

    ssl_certificate /etc/letsencrypt/live/ravi.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ravi.example.com/privkey.pem;

    client_max_body_size 190m;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    # Replace these networks with the OpenShot clients' and administrators' trusted CIDRs.
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    deny all;

    location /static/ {
        alias /var/lib/ravi-api/staticfiles/;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name ravi.example.com;
    return 301 https://$host$request_uri;
}
